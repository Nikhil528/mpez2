services:
  - type: web
    name: mpeb-license-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mpeb-license-db
          property: connectionString
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LICENSE_SECRET
        generateValue: true

databases:
  - name: mpeb-license-db
    plan: free
