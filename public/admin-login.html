<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><style>body{font-family:Arial;background:#f2f4f7}.box{max-width:380px;margin:70px auto;background:#fff;padding:25px;border-radius:14px}input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:8px}button{border:0;background:#1769e0;color:white;font-weight:bold}</style></head><body><div class="box"><h2>MPEB Admin Login</h2><input id="u" placeholder="Admin ID" autocomplete="username"><input id="p" type="password" placeholder="Admin Password" autocomplete="current-password"><button onclick="login()">Login</button><p id="m"></p></div><script>async function login(){m.textContent='';try{let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:u.value,password:p.value})});let d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Login failed');location.href='/admin'}catch(e){m.textContent=e.message}}</script></body></html>
