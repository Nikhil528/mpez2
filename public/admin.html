<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPEB Admin</title><style>body{font-family:Arial;background:#f4f6f8;margin:0}.wrap{max-width:1250px;margin:25px auto;padding:0 12px}.card{background:#fff;padding:18px;margin:12px 0;border-radius:12px}button{padding:8px;margin:2px;border:0;border-radius:7px;background:#1769e0;color:#fff}.danger{background:#c62828}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:7px;border-bottom:1px solid #ddd;white-space:nowrap}input,select{padding:8px;margin:4px}</style></head><body><div class="wrap"><div class="card"><h1>MPEB License Admin</h1><select id="type"><option value="annual">Annual (1 Year)</option><option value="lifetime">Lifetime</option><option value="trial">1 Day Trial</option></select><input id="expiry" type="datetime-local"><select id="payment_mode"><option value="cash">Cash</option><option value="online">Online</option></select><button onclick="gen()">Generate Key</button><button onclick="load()">Refresh</button><p id="new"></p></div><div class="card"><h2>Generated / Old Keys</h2><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Key Hint</th><th>Type</th><th>Status</th><th>Expiry</th><th>Device</th><th>Payment Mode</th><th>Payment</th><th>Customer</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><h2>Payment History</h2><div style="overflow:auto"><table><thead><tr><th>Payment ID</th><th>Order</th><th>Amount</th><th>Status</th><th>License</th><th>Date</th></tr></thead><tbody id="pay"></tbody></table></div></div></div><script>async function api(u,o={}){let r=await fetch(u,o),d=await r.json();if(!r.ok||d.success===false)throw Error(d.error||'Request failed');return d}async function gen(){try{let d=await api('/api/admin/licenses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:type.value,payment_mode:payment_mode.value,expires_at:expiry.value?new Date(expiry.value).toISOString():null})});new.textContent='New key: '+d.key;load()}catch(e){alert(e.message)}}async function load(){try{let d=await api('/api/admin/licenses');rows.innerHTML=d.licenses.map(x=>`<tr><td>${x.id}</td><td>••••${x.key_hint}</td><td>${x.type}</td><td>${x.status}</td><td>${x.expires_at?new Date(x.expires_at).toLocaleString():'Never'}</td><td>${x.device_hint||'Not activated'}</td><td>${x.payment_mode||'-'}</td><td>${x.razorpay_payment_id||'-'}</td><td>${x.customer_name||'-'}<br>${x.customer_phone||''}</td><td><button onclick="resetL(${x.id})">Reset</button><button onclick="stat(${x.id},'${x.status}')">${x.status==='active'?'Disable':'Enable'}</button><button class="danger" onclick="delL(${x.id})">Delete</button></td></tr>`).join('');let p=await api('/api/admin/payments');pay.innerHTML=p.payments.map(x=>`<tr><td>${x.razorpay_payment_id}</td><td>${x.razorpay_order_id}</td><td>₹${(x.amount/100).toFixed(2)}</td><td>${x.status}</td><td>${x.license_id||'-'}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')}catch(e){alert(e.message)}}async function resetL(id){if(confirm('Reset device binding?')){await api('/api/admin/licenses/'+id+'/reset',{method:'POST'});load()}}async function stat(id,s){await api('/api/admin/licenses/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s==='active'?'disabled':'active'})});load()}async function delL(id){if(confirm('Delete permanently?')){await api('/api/admin/licenses/'+id,{method:'DELETE'});load()}}load();</script></body></html>
