<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPEB License</title><style>body{font-family:Arial;background:#f2f4f7;margin:0}.box{max-width:480px;margin:40px auto;background:#fff;padding:24px;border-radius:14px}input,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:8px}button{border:0;background:#1769e0;color:#fff;font-weight:bold}.key{word-break:break-all;padding:12px;background:#eef4ff;font-weight:bold}</style></head><body><div class="box"><h2>MPEB Receipt License</h2><p>Get a 1-day trial or purchase lifetime license.</p><button onclick="trial()">Get 1-Day Trial Key</button><hr><b>Lifetime License — ₹499</b><input id="name" placeholder="Name"><input id="email" placeholder="Email"><input id="phone" placeholder="Mobile"><button onclick="buy()">Pay ₹499 & Generate Lifetime Key</button><p id="msg"></p><div id="out" style="display:none">Your Key:<div id="key" class="key"></div></div></div><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>async function trial(){try{let r=await fetch('/api/trial',{method:'POST'}),d=await r.json();if(!d.success)return msg.textContent=d.error;key.textContent=d.key;out.style.display='block';msg.textContent='Trial key created. Activate it from the MPEB receipt page on the same system.'}catch(e){msg.textContent='Server unavailable.'}}async function buy(){try{let r=await fetch('/api/payment/order',{method:'POST'}),d=await r.json();if(!d.success)return msg.textContent=d.error;new Razorpay({key:d.key_id,amount:d.amount,currency:d.currency,name:'MPEB Receipt',description:'Lifetime License',order_id:d.order_id,prefill:{name:name.value,email:email.value,contact:phone.value},handler:async x=>{let v=await fetch('/api/payment/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...x,name:name.value,email:email.value,phone:phone.value})}),z=await v.json();if(!z.success)return msg.textContent=z.error;key.textContent=z.key;out.style.display='block';msg.textContent='Payment verified. Lifetime key created.'}}).open()}catch(e){msg.textContent='Payment service unavailable.'}}</script></body></html>
